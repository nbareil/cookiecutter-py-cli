default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: format
        name: format
        entry: make format
        language: system
        types: [python]
        pass_filenames: false

      - id: lint
        name: lint
        entry: make lint
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: test
        name: test
        entry: make test
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
